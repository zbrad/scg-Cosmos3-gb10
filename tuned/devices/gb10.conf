# tuned/devices/gb10.conf — GB10 (DGX Spark) runtime-tuning profile for
# scg-Cosmos3-gb10.
#
# Unlike the compiled tuned-build repos in this fleet (pytorch,
# flash-attention, flashinfer, raft, cuvs, faiss, vllm), this repo has
# nothing to compile — there's no gencode/arch flag to set here. These are
# validated RUNTIME defaults (attention backend, torch.compile) instead,
# read by cosmos3_wrapper/tuned.py at node-load time (Python), not sourced
# by a bash build script. Same KEY="value" shape as the other repos'
# tuned/devices/*.conf for a human skimming this fleet, not because
# anything here actually gets `source`d.
#
# Validated 2026-09-17 against Cosmos3-Nano-nf4 and
# Cosmos3-Super-Text2Image-nf4 on node-gb10-2 (GB10, torch
# 2.15.0+gb10.cu133.tuning-v29, flash_attn 2.8.4+gb10.cu133.tuning.v21):
# flash attention backend + torch.compile(mode="reduce-overhead") together
# give ~18% faster steady-state step time on Nano, ~13.7% on Super, vs.
# native/SDPA with no compile. Full methodology/numbers:
# ../../../../tuned/docs/cosmos3_nf4_perf_plan.md (in the ComfyUI checkout
# this node is vendored into; that path is outside this repo, so it's only
# reachable from a checkout that has this node under custom_nodes/).
GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_HW_LABEL="GB10 / DGX Spark (Grace Blackwell, SM 121a)"
GPU_TUNED_DEVICE_NAME_MATCH="NVIDIA GB10"

COSMOS3_ATTN_BACKEND="flash"
COSMOS3_TORCH_COMPILE="true"
COSMOS3_TORCH_COMPILE_MODE="reduce-overhead"

# Exact versions this profile was validated against (node-gb10-2, 2026-09-17).
# Runtime version-verification (cosmos3_wrapper/tuned.py's
# verify_venv_pinning()) warns, but does not refuse to run, on a mismatch —
# routine tuning-vNN rebuilds are expected drift; a missing "+gb10." build
# tag entirely (vanilla PyPI torch/flash-attn) is the case actually worth
# worrying about.
#
# These are the *installed-distribution-metadata* form (importlib.metadata
# .version(), what pip actually recorded), not each package's own
# __version__ attribute -- torch.__version__ happens to match, but
# flash_attn.__version__ hardcodes just the upstream base version ("2.8.4",
# no local segment) and would never match anything here. Note the dot
# before "v29" below, not the hyphen torch.__version__ itself displays
# ("2.15.0+gb10.cu133.tuning-v29") -- setuptools normalizes the local
# version segment's separator when recording distribution metadata.
COSMOS3_VALIDATED_TORCH_VERSION="2.15.0+gb10.cu133.tuning.v29"
COSMOS3_VALIDATED_FLASH_ATTN_VERSION="2.8.4+gb10.cu133.tuning.v21"
